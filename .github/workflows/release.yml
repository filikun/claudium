name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.2.0
#   git push origin v1.2.0
# Bump <Version> in source/Claudium.csproj to match the tag before tagging —
# Velopack uses that number to compute the delta patch against the previous release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Fetch bundled Node.js runtime
        shell: pwsh
        run: .\scripts\fetch-node.ps1

      - name: Get version from tag
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # IMPORTANT: this must be `dotnet build`, not `dotnet publish` — publish silently
      # skips regenerating the compiled XAML (App.xbf/MainPage.xbf/MainWindow.xbf) and
      # the resource index (Claudium.pri). A fresh Claudium.dll paired with stale/missing
      # XAML binaries crashes instantly on launch with no window (0xc000027b) — see the
      # same warning in publish.ps1, which this mirrors for the release build.
      - name: Build self-contained app
        run: dotnet build source/Claudium.csproj -c Release -p:Platform=x64

      - name: Verify compiled XAML was generated
        shell: bash
        run: |
          dir="source/bin/x64/Release/net8.0-windows10.0.26100.0/win-x64"
          for f in App.xbf MainPage.xbf MainWindow.xbf Claudium.pri; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::Build output is missing $f — refusing to pack a build that would crash on startup."
              exit 1
            fi
          done

      - name: Stage build output for packing
        shell: bash
        run: |
          mkdir -p publish-release
          cp -r source/bin/x64/Release/net8.0-windows10.0.26100.0/win-x64/. publish-release/

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Download previous release (for delta patches)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }}

      - name: Pack release
        run: >
          vpk pack
          -u Claudium
          -v ${{ steps.get-version.outputs.version }}
          -p publish-release
          -e Claudium.exe
          --icon source/Assets/AppIcon.ico

      - name: Upload release to GitHub
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Claudium ${{ steps.get-version.outputs.version }}"
          --tag ${{ github.ref_name }}
